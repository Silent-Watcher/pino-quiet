name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: TypeScript checks
        run: pnpm run tsc

      - name: Biome checks
        run: pnpm exec biome check ./src ./tests ./example

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: pnpm pack smoke test
        run: pnpm run test:pack

  pino-9-compat:
    name: Pino 9 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Install Pino 9
        run: pnpm install --no-save pino@9

      - name: Run integration tests against Pino 9
        run: pnpm exec vitest run tests/pino.integration.test.ts
